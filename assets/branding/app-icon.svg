<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E111A" />
      <stop offset="50%" stop-color="#141824" />
      <stop offset="100%" stop-color="#1A1F30" />
    </linearGradient>

    <!-- Squircle Border Stroke Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BD93F9" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#FF79C6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0.5" />
    </linearGradient>

    <!-- Haze Atmospheric Radial Glows -->
    <radialGradient id="hazePurple" cx="30%" cy="35%" r="50%">
      <stop offset="0%" stop-color="#BD93F9" stop-opacity="0.45" />
      <stop offset="60%" stop-color="#BD93F9" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#BD93F9" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="hazeCyan" cx="70%" cy="65%" r="50%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#00F0FF" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="hazeMagenta" cx="50%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#FF79C6" stop-opacity="0.3" />
      <stop offset="70%" stop-color="#FF79C6" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#FF79C6" stop-opacity="0" />
    </radialGradient>

    <!-- Primary Brand Stroke Gradient -->
    <linearGradient id="brandGrad" x1="0%" y1="20%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#C084FC" />
      <stop offset="35%" stop-color="#FF79C6" />
      <stop offset="70%" stop-color="#8BE9FD" />
      <stop offset="100%" stop-color="#00F0FF" />
    </linearGradient>

    <!-- Bridge Gradient -->
    <linearGradient id="bridgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF79C6" />
      <stop offset="100%" stop-color="#00F0FF" />
    </linearGradient>

    <!-- Subtle Drop Shadow Filter for Depth -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24" result="blur1" />
      <feGaussianBlur stdDeviation="48" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" opacity="0.3" />
        <feMergeNode in="blur1" opacity="0.5" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- macOS Big Sur Squircle Body (Padding 96, Size 832x832, Corner Radius 192) -->
  <rect x="96" y="96" width="832" height="832" rx="192" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="6" />

  <!-- Atmospheric Glow Overlays -->
  <rect x="96" y="96" width="832" height="832" rx="192" fill="url(#hazePurple)" />
  <rect x="96" y="96" width="832" height="832" rx="192" fill="url(#hazeCyan)" />
  <rect x="96" y="96" width="832" height="832" rx="192" fill="url(#hazeMagenta)" />

  <!-- Monoline Nexus 'H' Mark -->
  <g filter="url(#neonGlow)">
    <!-- Left Pillar (Local Terminal Client) -->
    <rect x="290" y="270" width="60" height="484" rx="30" fill="url(#brandGrad)" />

    <!-- Right Pillar (Remote Host / Server) -->
    <rect x="674" y="270" width="60" height="484" rx="30" fill="url(#brandGrad)" />

    <!-- Terminal Prompt Chevron (Left-to-Center) -->
    <path
      d="M 350 430 L 485 512 L 350 594"
      fill="none"
      stroke="url(#brandGrad)"
      stroke-width="56"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Encrypted Bridge Channel (Center-to-Right) -->
    <path
      d="M 485 512 L 674 512"
      fill="none"
      stroke="url(#bridgeGrad)"
      stroke-width="56"
      stroke-linecap="round"
    />

    <!-- Terminal Cursor Underline (Right Bottom) -->
    <path
      d="M 525 594 L 625 594"
      fill="none"
      stroke="#00F0FF"
      stroke-width="56"
      stroke-linecap="round"
    />

    <!-- Nexus Data Pulse (Center Interconnection Node) -->
    <circle cx="485" cy="512" r="16" fill="#FFFFFF" opacity="0.95" />
  </g>
</svg>
