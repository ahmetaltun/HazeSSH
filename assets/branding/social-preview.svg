<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="spBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141118" />
      <stop offset="50%" stop-color="#1C1622" />
      <stop offset="100%" stop-color="#241B26" />
    </linearGradient>

    <!-- Brand Gradients -->
    <linearGradient id="spBrandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE1AC" />
      <stop offset="100%" stop-color="#FF825D" />
    </linearGradient>
    <linearGradient id="spBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE1AC" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#FF825D" stop-opacity="0.6" />
    </linearGradient>

    <!-- Atmospheric Warm Glows -->
    <radialGradient id="spGlow1" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#FF825D" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#FF825D" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="spGlow2" cx="80%" cy="70%" r="60%">
      <stop offset="0%" stop-color="#F17766" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#F17766" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="spAura" cx=".36" cy=".26" r=".84">
      <stop offset="0" stop-color="#F17766" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#F17766" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="spIconBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#382630"/>
      <stop offset="1" stop-color="#181922"/>
    </linearGradient>

    <filter id="spDropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1280" height="640" fill="url(#spBg)" />
  <rect width="1280" height="640" fill="url(#spGlow1)" />
  <rect width="1280" height="640" fill="url(#spGlow2)" />

  <!-- Architectural Grid -->
  <g opacity="0.06" stroke="#FFFFFF" stroke-width="1">
    <line x1="160" y1="0" x2="160" y2="640" />
    <line x1="320" y1="0" x2="320" y2="640" />
    <line x1="480" y1="0" x2="480" y2="640" />
    <line x1="640" y1="0" x2="640" y2="640" />
    <line x1="800" y1="0" x2="800" y2="640" />
    <line x1="960" y1="0" x2="960" y2="640" />
    <line x1="1120" y1="0" x2="1120" y2="640" />
    <line x1="0" y1="160" x2="1280" y2="160" />
    <line x1="0" y1="320" x2="1280" y2="320" />
    <line x1="0" y1="480" x2="1280" y2="480" />
  </g>

  <!-- Central Card & Lockup -->
  <g transform="translate(140, 140)">
    <!-- Brand Icon Squircle (Size 180x180) -->
    <g filter="url(#spDropShadow)">
      <svg width="180" height="180" viewBox="0 0 1024 1024">
        <rect x="48" y="48" width="928" height="928" rx="228" fill="url(#spIconBg)"/>
        <rect x="48" y="48" width="928" height="928" rx="228" fill="url(#spAura)"/>
        <rect x="49.5" y="49.5" width="925" height="925" rx="226.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="3"/>
        <path d="M290 713V310C290 292 304 278 322 278H342C360 278 374 292 374 310V462H650V310C650 292 664 278 682 278H704C722 278 736 292 736 310V713C736 731 722 745 704 745H682C664 745 650 731 650 713V560H374V713C374 731 360 745 342 745H322C304 745 290 731 290 713Z" fill="url(#spBrandGrad)"/>
        <path d="M511 462L558 511L511 560" fill="none" stroke="#2F222B" stroke-width="45" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </g>

    <!-- Typography -->
    <g transform="translate(230, 20)">
      <!-- App Name -->
      <text x="0" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="78" font-weight="900" letter-spacing="-1.5" fill="#FFFFFF">
        HAZE <tspan fill="url(#spBrandGrad)">SSH</tspan>
      </text>

      <!-- Subtitle -->
      <text x="5" y="115" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="500" fill="#E2E8F0" opacity="0.9">
        Fast, Privacy-First Terminal Multiplexer &amp; Hardware Hub
      </text>

      <!-- Feature Pill Badges -->
      <g transform="translate(5, 145)">
        <!-- Badge 1: Zero-Cloud -->
        <rect x="0" y="0" width="160" height="36" rx="18" fill="#251C22" stroke="#FFE1AC" stroke-width="1.5" />
        <text x="80" y="23" font-family="ui-monospace, monospace" font-size="13" font-weight="700" fill="#FFE1AC" text-anchor="middle">
          100% LOCAL-FIRST
        </text>

        <!-- Badge 2: Tauri v2 + Rust -->
        <rect x="175" y="0" width="175" height="36" rx="18" fill="#251C22" stroke="#FF825D" stroke-width="1.5" />
        <text x="262" y="23" font-family="ui-monospace, monospace" font-size="13" font-weight="700" fill="#FF825D" text-anchor="middle">
          TAURI v2 • RUST CORE
        </text>

        <!-- Badge 3: Multi-Protocol -->
        <rect x="365" y="0" width="230" height="36" rx="18" fill="#251C22" stroke="#F17766" stroke-width="1.5" />
        <text x="480" y="23" font-family="ui-monospace, monospace" font-size="13" font-weight="700" fill="#F17766" text-anchor="middle">
          SSH • SERIAL • TELNET • SFTP
        </text>
      </g>
    </g>
  </g>
</svg>
