<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="spBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0E17" />
      <stop offset="50%" stop-color="#121624" />
      <stop offset="100%" stop-color="#191F33" />
    </linearGradient>

    <!-- Brand Gradients -->
    <linearGradient id="spBrandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BD93F9" />
      <stop offset="45%" stop-color="#FF79C6" />
      <stop offset="100%" stop-color="#00F0FF" />
    </linearGradient>
    <linearGradient id="spBridgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF79C6" />
      <stop offset="100%" stop-color="#00F0FF" />
    </linearGradient>
    <linearGradient id="spBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BD93F9" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#FF79C6" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0.8" />
    </linearGradient>

    <!-- Atmospheric Glows -->
    <radialGradient id="spGlow1" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#BD93F9" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#BD93F9" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="spGlow2" cx="80%" cy="70%" r="60%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0" />
    </radialGradient>

    <filter id="spDropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1280" height="640" fill="url(#spBg)" />
  <rect width="1280" height="640" fill="url(#spGlow1)" />
  <rect width="1280" height="640" fill="url(#spGlow2)" />

  <!-- Subtle Architectural Grid -->
  <g opacity="0.08" stroke="#FFFFFF" stroke-width="1">
    <line x1="160" y1="0" x2="160" y2="640" />
    <line x1="320" y1="0" x2="320" y2="640" />
    <line x1="480" y1="0" x2="480" y2="640" />
    <line x1="640" y1="0" x2="640" y2="640" />
    <line x1="800" y1="0" x2="800" y2="640" />
    <line x1="960" y1="0" x2="960" y2="640" />
    <line x1="1120" y1="0" x2="1120" y2="640" />
    <line x1="0" y1="160" x2="1280" y2="160" />
    <line x1="0" y1="320" x2="1280" y2="320" />
    <line x1="0" y1="480" x2="1280" y2="480" />
  </g>

  <!-- Central Card & Lockup -->
  <g transform="translate(140, 140)">
    <!-- Brand Icon Squircle (Size 180x180) -->
    <g filter="url(#spDropShadow)">
      <rect width="180" height="180" rx="42" fill="#0E111A" stroke="url(#spBorderGrad)" stroke-width="3" />

      <!-- Left Pillar -->
      <rect x="42" y="42" width="16" height="96" rx="8" fill="url(#spBrandGrad)" />

      <!-- Right Pillar -->
      <rect x="122" y="42" width="16" height="96" rx="8" fill="url(#spBrandGrad)" />

      <!-- Terminal Prompt Chevron -->
      <path
        d="M 58 72 L 86 90 L 58 108"
        stroke="url(#spBrandGrad)"
        stroke-width="12"
        stroke-linecap="round"
        stroke-linejoin="round"
      />

      <!-- Encrypted Bridge -->
      <path
        d="M 86 90 L 122 90"
        stroke="url(#spBridgeGrad)"
        stroke-width="12"
        stroke-linecap="round"
      />

      <!-- Terminal Cursor Underline -->
      <path
        d="M 94 108 L 114 108"
        stroke="#00F0FF"
        stroke-width="10"
        stroke-linecap="round"
      />

      <!-- Center Data Node -->
      <circle cx="86" cy="90" r="5" fill="#FFFFFF" />
    </g>

    <!-- Typography -->
    <g transform="translate(230, 20)">
      <!-- App Name -->
      <text x="0" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="78" font-weight="900" letter-spacing="-1.5" fill="#FFFFFF">
        HAZE <tspan fill="url(#spBrandGrad)">SSH</tspan>
      </text>

      <!-- Subtitle -->
      <text x="5" y="115" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="500" fill="#E2E8F0" opacity="0.9">
        Fast, Privacy-First Terminal Multiplexer &amp; Hardware Hub
      </text>

      <!-- Feature Pill Badges -->
      <g transform="translate(5, 145)">
        <!-- Badge 1: Zero-Cloud -->
        <rect x="0" y="0" width="150" height="36" rx="18" fill="#1E2337" stroke="#BD93F9" stroke-width="1.5" />
        <text x="75" y="23" font-family="ui-monospace, monospace" font-size="13" font-weight="700" fill="#BD93F9" text-anchor="middle">
          100% LOCAL-FIRST
        </text>

        <!-- Badge 2: Tauri v2 + Rust -->
        <rect x="165" y="0" width="165" height="36" rx="18" fill="#1E2337" stroke="#FF79C6" stroke-width="1.5" />
        <text x="247" y="23" font-family="ui-monospace, monospace" font-size="13" font-weight="700" fill="#FF79C6" text-anchor="middle">
          TAURI v2 • RUST CORE
        </text>

        <!-- Badge 3: Multi-Protocol -->
        <rect x="345" y="0" width="220" height="36" rx="18" fill="#1E2337" stroke="#00F0FF" stroke-width="1.5" />
        <text x="455" y="23" font-family="ui-monospace, monospace" font-size="13" font-weight="700" fill="#00F0FF" text-anchor="middle">
          SSH • SERIAL • TELNET • SFTP
        </text>
      </g>
    </g>
  </g>
</svg>
