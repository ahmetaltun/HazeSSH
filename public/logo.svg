<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 90" width="460" height="90" fill="none">
  <defs>
    <linearGradient id="hzBrandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BD93F9" />
      <stop offset="45%" stop-color="#FF79C6" />
      <stop offset="100%" stop-color="#00F0FF" />
    </linearGradient>
    <linearGradient id="hzBridgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF79C6" />
      <stop offset="100%" stop-color="#00F0FF" />
    </linearGradient>
  </defs>

  <!-- Left Icon Mark Container (Size 72x72) -->
  <g transform="translate(10, 9)">
    <rect width="72" height="72" rx="18" fill="#0E111A" stroke="url(#hzBrandGrad)" stroke-width="2" />
    
    <!-- Left Pillar -->
    <rect x="16" y="16" width="6.5" height="40" rx="3.25" fill="url(#hzBrandGrad)" />

    <!-- Right Pillar -->
    <rect x="49.5" y="16" width="6.5" height="40" rx="3.25" fill="url(#hzBrandGrad)" />

    <!-- Terminal Prompt Chevron -->
    <path
      d="M 22.5 28.5 L 34 36 L 22.5 43.5"
      stroke="url(#hzBrandGrad)"
      stroke-width="5"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Encrypted Bridge -->
    <path
      d="M 34 36 L 49.5 36"
      stroke="url(#hzBridgeGrad)"
      stroke-width="5"
      stroke-linecap="round"
    />

    <!-- Terminal Cursor Underline -->
    <path
      d="M 37.5 43.5 L 46.5 43.5"
      stroke="#00F0FF"
      stroke-width="4.5"
      stroke-linecap="round"
    />

    <!-- Center Data Pulse -->
    <circle cx="34" cy="36" r="2.2" fill="#FFFFFF" />
  </g>

  <!-- Typography Lockup -->
  <g transform="translate(104, 0)">
    <!-- Primary App Title -->
    <text x="0" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="34" font-weight="800" letter-spacing="-0.5" fill="#FFFFFF">
      HAZE <tspan fill="url(#hzBrandGrad)">SSH</tspan>
    </text>

    <!-- Subtitle / Tagline -->
    <text x="2" y="70" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="3" fill="#8BE9FD" opacity="0.85">
      PRIVACY-FIRST MULTIPLEXER
    </text>
  </g>
</svg>
