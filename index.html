<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=3" />
    <link rel="alternate icon" type="image/x-icon" href="/favicon.ico?v=3" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Haze SSH</title>

    <!-- Synchronous theme pre-hydration to prevent FOUC and startup white flash -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("haze_ssh_theme");
          var theme = saved || "dracula";
          document.documentElement.setAttribute("data-theme", theme);
          var lightThemes = [
            "light", "nord", "corporate", "emerald", "cupcake", "retro",
            "cyberpunk", "valentine", "garden", "pastel", "lofi", "winter",
            "autumn", "acid", "lemonade", "wireframe", "caramellatte", "silk"
          ];
          if (lightThemes.indexOf(theme) !== -1) {
            document.documentElement.style.backgroundColor = "#ffffff";
            document.documentElement.style.colorScheme = "light";
          }
        } catch (_) {
          document.documentElement.setAttribute("data-theme", "dracula");
        }
      })();
    </script>

    <style>
      :root {
        color-scheme: dark;
        background-color: #282a36;
      }
      html,
      body,
      #root {
        background-color: #282a36;
        color: #f8f8f2;
        height: 100%;
        width: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
      }
    </style>
  </head>

  <body spellcheck="false" autocorrect="off" autocapitalize="none">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
